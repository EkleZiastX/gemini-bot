version: '3.8'

services:
  bot:
    build: .
    container_name: yuki-bot
    restart: unless-stopped
    environment:
      # Направляем бота на локальный сервер Telegram API
      - TELEGRAM_API_URL=http://telegram-bot-api:8081
    volumes:
      - ./config.json:/app/config.json:ro
      - ./data:/app/data
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    depends_on:
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "20656676"
      TELEGRAM_API_HASH: "a542c184631e5b5e7e495bca87097b84"
      TELEGRAM_LOCAL: "true"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data: